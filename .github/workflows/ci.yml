name: CI

on:
  push:
    branches: [main, next, 'codex/ci/**']
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  client-checks:
    name: client / checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The type check peaks near 2.6 GB, above the heap Node picks for itself
      # on a small runner; the release verification sets the same limit.
      NODE_OPTIONS: --max-old-space-size=4096
      VITE_LOCAL_ONLY_MODE: 'true'
      VITE_REQUIRE_AUTH: 'false'
      VITE_AI_TRANSPORT: direct
      VITE_API_BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:contract:check
      - run: node scripts/check-release.mjs "v$(node -p 'require("./package.json").version')"
      - run: pnpm openai:catalog:check
      - run: pnpm public:check
      - run: node scripts/check-macos-icon.mjs --check
      - run: pnpm security:dependencies
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm locales:check
      - run: pnpm agent:conversation-sync:check
      - run: pnpm agent:capabilities:check
      - run: pnpm exec vite build --config vite.renderer.config.ts

  client-tests:
    name: client / tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    env:
      VITE_LOCAL_ONLY_MODE: 'true'
      VITE_REQUIRE_AUTH: 'false'
      VITE_AI_TRANSPORT: direct
      VITE_API_BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:3000
      TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --shard="$TEST_SHARD"

  client-renderer:
    name: client / renderer contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DRIFTING_PERF_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Verify headless browser binary
        run: '"$DRIFTING_PERF_CHROME" --version'
      - name: Check current renderer behavior and operation counts
        run: pnpm perf:renderer --ci --output=.local-data/renderer-performance/ci.json
      - name: Check renderer resource release
        run: pnpm perf:renderer:lifecycle --output=.local-data/renderer-performance/lifecycle.json
      - name: Retain renderer evidence and failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renderer-contracts-${{ github.sha }}
          path: |
            .local-data/renderer-performance/ci.json
            .local-data/renderer-performance/lifecycle.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  # Keep the stable `client` context required by the main-branch ruleset while
  # allowing checks, builds, and test shards to finish independently.
  client:
    name: client
    if: ${{ always() }}
    needs: [client-checks, client-tests, client-renderer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every client lane
        env:
          CHECKS_RESULT: ${{ needs.client-checks.result }}
          TESTS_RESULT: ${{ needs.client-tests.result }}
          RENDERER_RESULT: ${{ needs.client-renderer.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$TESTS_RESULT" = success
          test "$RENDERER_RESULT" = success

  native:
    runs-on: macos-26
    # A cold build of the app plus the shared database tests (five minutes on
    # a desktop Mac) needs the same room as the release verification.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, toolchain input
        with:
          toolchain: 1.96.0
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            src-tauri
            crates/drifting-core
            crates/drifting-document
            crates/drifting-prose
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

      - run: cargo fmt --manifest-path crates/drifting-core/Cargo.toml --check
      # core:test first checks the prose journal fixture with a TypeScript
      # oracle, so this lane needs Node and the frozen dependencies too.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm core:test
      # The Rust lockfiles against the RustSec advisory database; pnpm audit
      # covers the npm side in client / checks.
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: pnpm security:rust

  linux-tests:
    uses: ./.github/workflows/linux.yml

  windows-tests:
    uses: ./.github/workflows/windows.yml

  next-tests:
    uses: ./.github/workflows/next.yml

  codex-compatibility:
    uses: ./.github/workflows/codex-compatibility.yml

  cloud-tests:
    name: Cloud tests
    if: ${{ always() }}
    needs: [client, native, linux-tests, windows-tests, next-tests, codex-compatibility]
    runs-on: ubuntu-latest
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - run: |
          for result in $RESULTS; do
            test "$result" = success || exit 1
          done

  linux-preview:
    if: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/codex/ci/') }}
    needs: cloud-tests
    uses: ./.github/workflows/linux.yml
    with:
      build: true

  windows-preview:
    if: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/codex/ci/') }}
    needs: cloud-tests
    uses: ./.github/workflows/windows.yml
    with:
      build: true

  next-build:
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/codex/ci/') }}
    needs: cloud-tests
    uses: ./.github/workflows/next.yml
    with:
      build: true

  cloud-build:
    name: Cloud build
    if: ${{ always() && (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/codex/ci/')) }}
    needs: [cloud-tests, linux-preview, windows-preview, next-build, macos-preview]
    runs-on: ubuntu-latest
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - run: |
          for result in $RESULTS; do
            test "$result" = success || exit 1
          done

  promotion:
    name: Verify main promotion
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require a merged PR from this repository's next branch
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
            jq -es --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '
              any(.[][]; .merge_commit_sha == $sha and .merged_at != null
                and .base.ref == "main" and .head.ref == "next"
                and .head.repo.full_name == $repo)
            '

  release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [cloud-tests, next-build, promotion]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit

  macos-preview:
    if: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/codex/ci/') }}
    needs: cloud-tests
    runs-on: macos-26
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, toolchain input
        with:
          toolchain: 1.96.0
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Build the local macOS preview
        env:
          VITE_LOCAL_ONLY_MODE: 'true'
          VITE_REQUIRE_AUTH: 'false'
          VITE_AI_TRANSPORT: direct
          VITE_API_BASE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:3000
        run: |
          pnpm exec tauri build --target aarch64-apple-darwin --bundles dmg \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drifting-macos-arm64-${{ github.sha }}
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  next-release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [cloud-tests, next-build, promotion]
    permissions:
      contents: write
    uses: ./.github/workflows/release-next.yml
