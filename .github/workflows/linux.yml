name: Desktop Builds

# Linux native tests, preview installers and manual evidence refresh.
on:
  workflow_call:
    inputs:
      build:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      evidence_ref:
        description: 'Only regenerate acceptance evidence for this repository branch (empty runs desktop builds)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    if: ${{ !inputs.evidence_ref }}
    name: linux / ${{ (inputs.build || github.event_name == 'workflow_dispatch') && 'build' || 'tests' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      VITE_LOCAL_ONLY_MODE: 'true'
      VITE_REQUIRE_AUTH: 'false'
      VITE_AI_TRANSPORT: direct
      VITE_API_BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, toolchain input
        with:
          toolchain: 1.96.0
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            src-tauri
            crates/drifting-core
            crates/drifting-document
            crates/drifting-prose
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential file libayatana-appindicator3-dev libgtk-3-dev \
            libsecret-1-dev librsvg2-dev libwebkit2gtk-4.1-dev patchelf pkg-config \
            desktop-file-utils xauth xdg-utils xvfb
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --frozen-lockfile
      - if: ${{ !inputs.build }}
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - if: ${{ !inputs.build }}
        run: mkdir -p dist && printf '<!doctype html>\n' > dist/index.html
      - if: ${{ !inputs.build }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - if: ${{ !inputs.build }}
        run: pnpm typecheck
      - if: ${{ !inputs.build }}
        run: pnpm exec vite build --config vite.renderer.config.ts
      - if: ${{ inputs.build || github.event_name == 'workflow_dispatch' }}
        name: Build AppImage and DEB packages
        run: pnpm tauri:build -- --bundles appimage,deb
      - if: ${{ inputs.build || github.event_name == 'workflow_dispatch' }}
        name: Smoke test the AppImage
        shell: bash
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$APPIMAGE"
          chmod +x "$APPIMAGE"
          export APPIMAGE_EXTRACT_AND_RUN=1
          LOG="$RUNNER_TEMP/drifting-linux.log"
          timeout --signal=TERM 20s xvfb-run -a env WEBKIT_DISABLE_COMPOSITING_MODE=1 "$APPIMAGE" >"$LOG" 2>&1 &
          PID=$!
          sleep 8
          if ! kill -0 "$PID" 2>/dev/null; then
            cat "$LOG"
            wait "$PID"
          fi
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
      - if: ${{ inputs.build || github.event_name == 'workflow_dispatch' }}
        name: Collect Linux artifacts
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          DEB=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          test -f "$APPIMAGE" && test -f "$DEB"
          mkdir -p out/linux
          cp "$APPIMAGE" "out/linux/Drifting_${VERSION}_linux_x86_64.AppImage"
          cp "$DEB" "out/linux/Drifting_${VERSION}_linux_x86_64.deb"
      - if: ${{ inputs.build || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drifting-linux-${{ github.sha }}
          path: out/linux/*
          if-no-files-found: error
          retention-days: 14

  refresh-evidence:
    name: Refresh generated acceptance evidence
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.evidence_ref != '' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.evidence_ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            src-tauri
            crates/drifting-core
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm core:fixtures:generate
      - run: pnpm agent:conversation-sync:evidence
      - name: Record the exact source revision
        run: git rev-parse HEAD > evidence-source.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-acceptance-evidence
          if-no-files-found: error
          path: |
            docs/sync-engine/acceptance/agent-conversation-sync.json
            crates/drifting-core/tests/fixtures/prose-journal-v1.json
            evidence-source.txt
