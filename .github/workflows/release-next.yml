name: Next Release
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: next-release
  cancel-in-progress: false
jobs:
  prepare:
    name: Reserve one Next Alpha release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      commit: ${{ steps.prepare.outputs.commit }}
      published: ${{ steps.prepare.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s next/script/tests -v
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.sha }}
        run: python next/script/release-next.py --source "$SOURCE" --output "$RUNNER_TEMP/release-metadata"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: next-release-metadata
          path: ${{ runner.temp }}/release-metadata/
          if-no-files-found: error
  verify:
    name: Verify / ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: windows-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    defaults:
      run:
        working-directory: next
    env:
      DR_UI_REQUIRE_FONTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy, rust-src
      - name: Bound Linux build disk usage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          {
            echo 'CARGO_PROFILE_DEV_DEBUG=0'
            echo 'CARGO_PROFILE_TEST_DEBUG=0'
            echo 'CARGO_INCREMENTAL=0'
          } >> "$GITHUB_ENV"
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |-
          sudo apt-get update
          sudo apt-get install --yes build-essential clang cmake gettext-base libasound2-dev libdbus-1-dev libfontconfig-dev libgit2-dev libglib2.0-dev libssl-dev libva-dev libvulkan1 libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev lld llvm pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: next
          key: release-${{ matrix.platform }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install fonttools==4.60.1
      - run: python crates/dr-ui/script/build-fonts.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo xtask check
      - run: cargo test --locked -p dr-platform --features next-alpha identity::tests
      - run: cargo build --release --locked -p drifting --features next-alpha
      - if: runner.os == 'Linux'
        run: cargo xtask check-binary target/release/drifting
      - if: runner.os == 'Windows'
        run: cargo xtask check-binary target/release/drifting.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: next-binary-${{ matrix.platform }}
          include-hidden-files: true
          path: |-
            next/target/release/drifting
            next/target/release/drifting.exe
            next/.cache/fonts/
          if-no-files-found: error
  linux:
    name: Package and launch Linux x86_64
    needs:
      - prepare
      - verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: next-binary-linux-x64
          path: next/
      - name: Runtime and packaging tools
        run: |-
          sudo apt-get update
          sudo apt-get install --yes curl dpkg-dev file libasound2t64 libdbus-1-3 libegl1 libfontconfig1 libvulkan1 libwayland-client0 libx11-xcb1 libxkbcommon0 libxkbcommon-x11-0 mesa-vulkan-drivers dbus-x11 xvfb xdotool
      - name: Package and verify
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash next/script/bundle-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: next-linux-installers
          path: out/release/*
          if-no-files-found: error
  windows:
    name: Package and launch Windows x64
    needs:
      - prepare
      - verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: next-binary-windows-x64
          path: next/
      - run: choco install nsis --no-progress -y
      - name: Package and verify
        shell: pwsh
        run: |-
          next/script/bundle-windows.ps1 -BuildProfile release -NextAlpha -SkipBuild -Output out/release
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
          $installer = Get-ChildItem out/release/*.exe | Select-Object -First 1
          next/script/check-next-installer.ps1 -Installer $installer.FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: next-windows-installer
          path: out/release/*.exe
          if-no-files-found: error
  draft:
    name: Create or refresh verified release draft
    needs:
      - prepare
      - linux
      - windows
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: next-*-installer*
          merge-multiple: true
          path: release/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: next-release-metadata
          path: metadata/
      - name: Check artifact set and hashes
        shell: bash
        run: |-
          test "$(find release -maxdepth 1 -name '*.AppImage' | wc -l)" -eq 1
          test "$(find release -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          test "$(find release -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          (cd release && sha256sum ./*.AppImage ./*.deb ./*.exe > SHA256SUMS.txt)
      - name: Draft only
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |-
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "Drifting Next $VERSION" --notes-file metadata/notes.md --prerelease --draft
          else
            gh release create "$TAG" release/* --target "$COMMIT" --title "Drifting Next $VERSION" --notes-file metadata/notes.md --prerelease --draft
          fi
