name: Release

# Only the main push pipeline calls this workflow after cloud validation.
on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # The type check needs more than the ~2 GB heap Node gives itself on the
      # 7 GB macOS runner (it peaks near 2.6 GB); 4 GB is what a desktop Mac allows.
      NODE_OPTIONS: --max-old-space-size=4096
      VITE_LOCAL_ONLY_MODE: 'true'
      VITE_REQUIRE_AUTH: 'false'
      VITE_AI_TRANSPORT: direct
      VITE_API_BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, toolchain input
        with:
          toolchain: 1.96.0
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-release.mjs "v$(node -p 'require("./package.json").version')"
      - run: pnpm ci:contract:check
      - run: pnpm public:check
      - run: node scripts/check-macos-icon.mjs --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm agent:capabilities:check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

  build:
    needs: verify
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      # Built against the macOS 26 SDK, as the app is developed: macOS draws
      # an app linked against an older SDK with the older title bar, whose
      # buttons sit lower than the traffic-light position the app sets.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # The official build signs in to Hosted and allows sign-up.
      DRIFTING_HOSTED_ORIGIN: ${{ vars.DRIFTING_HOSTED_ORIGIN }}
      VITE_TERMS_URL: https://drifting.cc/terms
      VITE_PRIVACY_URL: https://drifting.cc/privacy
      DRIFTING_UPDATER_PUBLIC_KEY: ${{ vars.DRIFTING_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, toolchain input
        with:
          toolchain: 1.96.0
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Require release inputs
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=0
          for name in DRIFTING_HOSTED_ORIGIN DRIFTING_UPDATER_PUBLIC_KEY TAURI_SIGNING_PRIVATE_KEY \
            APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then echo "::error::$name is not configured"; missing=1; fi
          done
          exit "$missing"
      - name: Import Developer ID Application certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/drifting-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/drifting-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          APPLE_SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          test -n "$APPLE_SIGNING_IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: Install App Store Connect notarization key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$APPLE_API_KEY_PATH" >> "$GITHUB_ENV"
      - name: Build, sign, notarize and staple
        run: node scripts/run-desktop-tauri.mjs build --online --target aarch64-apple-darwin --bundles app,dmg
      - name: Sign, notarize and staple the disk image
        # Tauri notarizes and staples the app inside it. The disk image people
        # download is a container of its own, so it is signed, notarized and
        # stapled too, and Gatekeeper can check it offline when it is opened.
        run: |
          DMG_PATH=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -f "$DMG_PATH"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG_PATH"
          RESULT=$(xcrun notarytool submit "$DMG_PATH" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --output-format json)
          echo "$RESULT"
          test "$(printf '%s' "$RESULT" | jq -r .status)" = Accepted
          xcrun stapler staple "$DMG_PATH"
      - name: Verify signed artifacts
        run: |
          BUNDLE=src-tauri/target/aarch64-apple-darwin/release/bundle
          APP_PATH=$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app' -print -quit)
          DMG_PATH=$(find "$BUNDLE/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
          UPDATE_PATH=$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app.tar.gz' -print -quit)
          test -d "$APP_PATH" && test -f "$DMG_PATH" && test -f "$UPDATE_PATH" && test -f "$UPDATE_PATH.sig"
          node scripts/check-macos-icon.mjs --bundle "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"
          mkdir -p "$RUNNER_TEMP/drifting-dmg"
          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/drifting-dmg"
          MOUNTED_APP=$(find "$RUNNER_TEMP/drifting-dmg" -maxdepth 1 -name '*.app' -print -quit)
          node scripts/check-macos-icon.mjs --bundle "$MOUNTED_APP"
          codesign --verify --deep --strict --verbose=2 "$MOUNTED_APP"
          spctl --assess --type execute --verbose=2 "$MOUNTED_APP"
          hdiutil detach "$RUNNER_TEMP/drifting-dmg"
      - name: Assemble release files
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUNDLE=src-tauri/target/aarch64-apple-darwin/release/bundle
          RELEASE_DIR="$RUNNER_TEMP/drifting-release"
          mkdir -p "$RELEASE_DIR"
          # The Mac installer names macOS, as the Windows installers name Windows.
          DMG=$(find "$BUNDLE/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
          cp "$DMG" "$RELEASE_DIR/Drifting_${VERSION}_macos_arm64.dmg"
          cp "$BUNDLE"/macos/*.app.tar.gz "$BUNDLE"/macos/*.app.tar.gz.sig "$RELEASE_DIR/"
          UPDATE_NAME=$(basename "$(find "$RELEASE_DIR" -maxdepth 1 -name '*.app.tar.gz' -print -quit)")
          node scripts/create-update-manifest.mjs \
            --version "$VERSION" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/main-${GITHUB_SHA}/${UPDATE_NAME}" \
            --signature-file "$RELEASE_DIR/$UPDATE_NAME.sig" \
            --notes-file "docs/releases/${VERSION}.md" \
            --output "$RELEASE_DIR/latest.json"
          node scripts/generate-release-sbom.mjs "$RELEASE_DIR/sbom.spdx.json"
          (cd "$RELEASE_DIR" && shasum -a 256 ./* > SHA256SUMS.txt)
          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release
          path: ${{ env.RELEASE_DIR }}/*
          if-no-files-found: error
          retention-days: 7

  # Windows installers are not Authenticode-signed yet.
  build-windows:
    name: build (windows ${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: release
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      DRIFTING_HOSTED_ORIGIN: ${{ vars.DRIFTING_HOSTED_ORIGIN }}
      VITE_TERMS_URL: https://drifting.cc/terms
      VITE_PRIVACY_URL: https://drifting.cc/privacy
      DRIFTING_UPDATER_PUBLIC_KEY: ${{ vars.DRIFTING_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, toolchain input
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Build the installer and its signed updater artifact
        run: node scripts/run-desktop-tauri.mjs build --online --target ${{ matrix.target }} --bundles nsis
      - name: Collect release files
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          INSTALLER=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -maxdepth 1 -name '*-setup.exe' -print -quit)
          test -f "$INSTALLER" && test -f "$INSTALLER.sig"
          NAME="Drifting_${VERSION}_windows_${{ matrix.arch }}-setup.exe"
          mkdir -p out/windows-release
          cp "$INSTALLER" "out/windows-release/$NAME"
          cp "$INSTALLER.sig" "out/windows-release/$NAME.sig"
      # As in windows.yml: an installer whose App exits at start never reaches
      # the draft. Install it for this user, open Drifting and require it still
      # running 20 seconds later.
      - name: Install and open the App
        shell: pwsh
        run: |
          $installer = Get-ChildItem out/windows-release/*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $app = Join-Path $env:LOCALAPPDATA 'Drifting\drifting.exe'
          if (-not (Test-Path $app)) { throw "the installer did not install $app" }
          $stderr = Join-Path $env:RUNNER_TEMP 'drifting-stderr.txt'
          $process = Start-Process -FilePath $app -RedirectStandardError $stderr -PassThru
          Start-Sleep -Seconds 20
          $exited = $process.HasExited
          Get-Content $stderr -ErrorAction SilentlyContinue
          if ($exited) { throw "Drifting exited at start with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-${{ matrix.arch }}
          path: out/windows-release/*
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: build (linux x86_64)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      DRIFTING_HOSTED_ORIGIN: ${{ vars.DRIFTING_HOSTED_ORIGIN }}
      VITE_TERMS_URL: https://drifting.cc/terms
      VITE_PRIVACY_URL: https://drifting.cc/privacy
      DRIFTING_UPDATER_PUBLIC_KEY: ${{ vars.DRIFTING_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, toolchain input
        with:
          toolchain: 1.96.0
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: x86_64-unknown-linux-gnu
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential file libayatana-appindicator3-dev libgtk-3-dev \
            libsecret-1-dev librsvg2-dev libwebkit2gtk-4.1-dev patchelf pkg-config \
            xvfb
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Build the Linux packages and signed updater artifact
        run: node scripts/run-desktop-tauri.mjs build --online --target x86_64-unknown-linux-gnu --bundles appimage,deb
      - name: Collect Linux release files
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUNDLE="src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"
          APPIMAGE=$(find "$BUNDLE/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)
          UPDATE=$(find "$BUNDLE/appimage" -maxdepth 1 -name '*.AppImage.tar.gz' -print -quit)
          DEB=$(find "$BUNDLE/deb" -maxdepth 1 -name '*.deb' -print -quit)
          test -f "$APPIMAGE" && test -f "$UPDATE" && test -f "$UPDATE.sig" && test -f "$DEB"
          mkdir -p out/linux-release
          cp "$APPIMAGE" "out/linux-release/Drifting_${VERSION}_linux_x86_64.AppImage"
          cp "$DEB" "out/linux-release/Drifting_${VERSION}_linux_x86_64.deb"
          cp "$UPDATE" "out/linux-release/Drifting_${VERSION}_linux_x86_64.AppImage.tar.gz"
          cp "$UPDATE.sig" "out/linux-release/Drifting_${VERSION}_linux_x86_64.AppImage.tar.gz.sig"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-release
          path: out/linux-release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish all desktop platforms
    needs: [build, build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BEFORE_SHA: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '{windows,linux}-release*'
          path: windows-release
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-release
          path: release-manifest
      - name: Assemble the full release and publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="main-$GITHUB_SHA"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/main-${GITHUB_SHA}"
          for pair in x64:windows-x86_64 arm64:windows-aarch64; do
            ARCH=${pair%%:*}
            PLATFORM=${pair##*:}
            NAME="Drifting_${VERSION}_windows_${ARCH}-setup.exe"
            test -f "windows-release/$NAME" && test -f "windows-release/$NAME.sig"
            node scripts/merge-update-manifest.mjs --manifest release-manifest/latest.json \
              --platform "$PLATFORM" --url "$BASE/$NAME" \
              --signature-file "windows-release/$NAME.sig" --version "$VERSION"
          done
          LINUX_NAME="Drifting_${VERSION}_linux_x86_64.AppImage.tar.gz"
          test -f "windows-release/$LINUX_NAME" && test -f "windows-release/$LINUX_NAME.sig"
          node scripts/merge-update-manifest.mjs --manifest release-manifest/latest.json \
            --platform linux-x86_64 --url "$BASE/$LINUX_NAME" \
            --signature-file "windows-release/$LINUX_NAME.sig" --version "$VERSION"
          mv windows-release/* release-manifest/
          node scripts/write-release-commits.mjs "$BEFORE_SHA" "$GITHUB_SHA" \
            "docs/releases/${VERSION}.md" release-manifest/COMMITS.txt "$RUNNER_TEMP/release-notes.md"
          rm release-manifest/SHA256SUMS.txt
          (cd release-manifest && sha256sum ./* > "$RUNNER_TEMP/SHA256SUMS.txt")
          mv "$RUNNER_TEMP/SHA256SUMS.txt" release-manifest/

          if state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            # A rerun of an already-published commit leaves its assets intact.
            if [[ "$state" == false ]]; then exit 0; fi
            gh release upload "$TAG" release-manifest/* --clobber
          else
            gh release create "$TAG" release-manifest/* --target "$GITHUB_SHA" \
              --draft --title "Drifting ${VERSION} (${GITHUB_SHA::12})" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          latest=false
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then latest=true; fi
          gh release edit "$TAG" --draft=false --latest="$latest" --notes-file "$RUNNER_TEMP/release-notes.md"
